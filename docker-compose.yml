services:
  mysql:
    image: mysql:8.4
    container_name: wasteapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wasteapp
      MYSQL_USER: wasteuser
      MYSQL_PASSWORD: wastepass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    container_name: wasteapp-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"

volumes:
  mysql_data:

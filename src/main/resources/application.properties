spring.application.name=wasteapp-final

# Lokalno se koristi MySQL iz Dockera, a u produkciji se vrijednosti ?itaju iz varijabli okru?enja.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3310/wasteappfinal?useSSL=false&serverTimezone=Europe/Zagreb&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:wasteuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:wastepass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

app.jwt.secret=${APP_JWT_SECRET:local-development-secret-change-this-value-123456789}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:120}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://wasteapp-frontend.onrender.com}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

server.port=${PORT:8080}
